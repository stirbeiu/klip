services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      # Connects to the 'db' service defined below via the internal Docker network
      - MONGODB_URI=mongodb://db:27017/klip
    depends_on:
      - db
    restart: always

  db:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
