<div id="login-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <button class="modal-close" id="closeLoginModal" aria-label="Close Modal"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-header">
            <h2>Welcome Back</h2>
            <p>Log in to access your klip account</p>
        </div>
        
        <form id="loginForm" class="modal-form">
            <div id="loginErrorMsg" class="error-message hidden">
                <i class="fa-solid fa-circle-exclamation"></i> Invalid username or password
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="user or admin" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" placeholder="user123 or admin123" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" id="loginSubmitBtn">Log In</button>
        </form>
        
        <div class="modal-footer">
            <p>Don't have an account? <a href="#" class="accent-link">Sign up</a></p>
        </div>
    </div>
</div>
