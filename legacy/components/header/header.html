<header>
    <div class="header-content">
        <a href="index.html" class="logo">klip</a>
        <div class="search">
            <form action="/search" method="get">
                <input type="text" placeholder="Search" name="query" aria-label="Search content">
                <button type="submit" aria-label="Search"><i class="fa fa-search"></i></button>
            </form>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="btn-upload">Upload</a></li>
                <li class="user-menu-container">
                    <!-- Guest State -->
                    <a href="#" class="btn-login" id="loginHeaderBtn" aria-label="Log In">Log In</a>

                    <!-- Authenticated State (Hidden initially) -->
                    <div id="authUserMenu" class="auth-hidden">
                        <a href="#" class="profile-trigger" id="userMenuBtn" aria-label="User Menu">
                            <div class="header-avatar-container">
                                <div id="headerAvatar" class="header-avatar"></div>
                                <span class="badge" id="notificationBadge">10+</span>
                            </div>
                            <span id="headerMenuUsername" class="header-username">Username</span>
                        </a>
                        <div class="user-dropdown" id="userDropdown">
                            <!-- Admin specific link -->
                            <a href="admin.html" id="adminPanelLink" class="auth-hidden">
                                <i class="fa-solid fa-user-shield" style="color: var(--accent-color);"></i>
                                <span style="font-weight: 600;">Admin Panel</span>
                            </a>

                            <a href="#" style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="display: flex; align-items: center; gap: 0.5rem;"><i
                                        class="fa-solid fa-inbox"></i>
                                    Inbox</span>
                                <span
                                    style="font-size: 0.8rem; background: var(--accent-color); color: var(--primary-color); padding: 0.1rem 0.4rem; border-radius: 10px;">10+</span></a>
                            <a href="#" id="themeToggle"><i class="fa-solid fa-sun"></i> <span>Switch to Light
                                    Mode</span></a>
                            <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
                            <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
    </div>
</header>
