<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <!-- Theme Init (Must be first to prevent flash) -->
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Watch - Klip</title>
</head>

<body>
    <!-- App Notice -->
    <div id="app-notice"></div>

    <!-- Dynamic Header -->
    <div id="app-header"></div>

    <!-- Main Content (Theater Mode) -->
    <main class="watch-container">

        <!-- Video Player Section -->
        <div class="player-wrapper">
            <div class="video-player" id="videoPlayerContainer">
                <video id="mainVideo" style="width: 100%; height: 100%;">
                    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <!-- Overlay Play Button (Big Center) -->
                <div class="player-overlay" id="bigPlayBtn">
                    <div class="play-circle-bg">
                        <i class="fa-solid fa-play"></i>
                    </div>
                </div>

                <!-- Custom Controls Bar -->
                <!-- Custom Controls Bar (macOS Style) -->
                <div class="controls-bar" id="controlsBar">
                    <!-- Top Row: Controls -->
                    <div class="controls-top">
                        <!-- Left: Volume -->
                        <div class="volume-container">
                            <button class="btn-control" id="volumeBtn" data-tooltip="Mute (m)"><i
                                    class="fa-solid fa-volume-high"></i></button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1"
                                value="1" data-tooltip="Volume">
                        </div>

                        <!-- Center: Play -->
                        <div class="playback-controls">
                            <!-- Removed Skips as requested -->
                            <button class="btn-control btn-play-large" id="playPauseBtn" data-tooltip="Play (k)"><i
                                    class="fa-solid fa-play"></i></button>
                        </div>

                        <!-- Right: Settings & Toggles -->
                        <div class="controls-right-group">
                            <!-- Quality Selector -->
                            <div class="dropdown-control">
                                <button class="btn-text" id="qualityBtn" data-tooltip="Quality">1080p</button>
                                <div class="menu-popup" id="qualityMenu">
                                    <div class="menu-item active">1080p</div>
                                    <div class="menu-item">720p</div>
                                    <div class="menu-item">480p</div>
                                </div>
                            </div>

                            <!-- Speed Selector -->
                            <div class="dropdown-control">
                                <button class="btn-text" id="speedBtn" data-tooltip="Speed">1x</button>
                                <div class="menu-popup" id="speedMenu">
                                    <div class="menu-item" data-speed="2">2x</div>
                                    <div class="menu-item" data-speed="1.5">1.5x</div>
                                    <div class="menu-item active" data-speed="1">1x</div>
                                    <div class="menu-item" data-speed="0.5">0.5x</div>
                                </div>
                            </div>

                            <!-- PIP (Optional but good for macOS feel) -->
                            <button class="btn-control" id="pipBtn" data-tooltip="Mini Player (i)"><i
                                    class="fa-solid fa-clone"></i></button>

                            <!-- Fullscreen -->
                            <button class="btn-control" id="fsBtn" data-tooltip="Fullscreen (f)"><i
                                    class="fa-solid fa-expand"></i></button>
                        </div>
                    </div>

                    <!-- Bottom Row: Scrubber -->
                    <div class="controls-bottom">
                        <span class="time-text" id="currentTime">0:00</span>
                        <input type="range" class="video-progress" id="seekSlider" value="0" min="0" max="100"
                            step="0.1" data-tooltip="Seek">
                        <span class="time-text" id="duration">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info & Comments Column -->
        <div class="content-wrapper">

            <!-- Video Info (Full Width) -->
            <div class="video-info">
                <h1 class="watch-title" id="watchTitle">Loading video...</h1>

                <div class="video-stats-bar">
                    <div class="stats-left">
                        <span class="view-count" id="watchViews">... views</span>
                        <span class="dot">•</span>
                        <span class="upload-date" id="watchDate">...</span>
                    </div>

                    <div class="actions-right">
                        <div class="like-dislike-group">
                            <button class="btn-action" id="btnLike">
                                <i class="fa-regular fa-thumbs-up"></i> <span id="likeCount">...</span>
                            </button>
                            <button class="btn-action" id="btnDislike">
                                <i class="fa-regular fa-thumbs-down"></i> <span id="dislikeCount">...</span>
                            </button>
                        </div>
                        <button class="btn-action"><i class="fa-solid fa-share"></i> Share</button>
                        <button class="btn-action"><i class="fa-regular fa-flag"></i> Report</button>
                    </div>
                </div>

                <hr class="divider">

                <div class="channel-row">
                    <div class="channel-info">
                        <div class="channel-avatar" id="channelAvatar"></div>
                        <div class="channel-text">
                            <h3 class="channel-name" id="channelName">...</h3>
                            <span class="sub-count" id="subCount">... subscribers</span>
                        </div>
                    </div>
                    <button class="btn-subscribe" id="btnSubscribe">Subscribe</button>
                </div>

                <div class="video-description">
                    <p id="videoDescription">...</p>
                </div>

                <hr class="divider">

                <!-- Comments Section (Moved here) -->
                <div class="comments-section">
                    <h3>Comments <span class="comment-count-display">...</span></h3>

                    <div class="add-comment">
                        <div class="user-avatar-small"></div>
                        <input type="text" placeholder="Add a comment...">
                    </div>

                    <div class="comments-list" id="commentsList">
                        <!-- Dynamic Comments -->
                    </div>

                    <div class="load-more-container" style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn-load-more"
                            style="background: transparent; border: 1px solid var(--secondary-color); color: var(--secondary-color); padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; opacity: 0.8;">Load
                            more comments</button>
                    </div>
                </div>
            </div>

            <!-- Sidebar (Optional for Up Next later, standard width) -->
            <div class="watch-sidebar">
                <!-- Potential Up Next videos could go here -->
            </div>

        </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="app-footer"></div>

    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script> <!-- Handles Header/Footer Loading -->
    <script src="js/toggleappearance.js"></script> <!-- Loaded by main.js usually, but good to keep if safe -->
    <script src="components/video-player/video-player.js"></script>
    <script src="js/watch.js"></script>
</body>

</html>
